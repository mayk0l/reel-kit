[captions]
highlight = ["4", "MESES", "DESCONTINUADO", "24/7", "24-7", "MULTIDIOMA", "AVATAR", "CIBERSEGURIDAD", "AGÉNTICA",
             "SMART", "REPORT", "DÍAS", "MINUTOS", "RAPIDEZ", "CHATGPT", "COMPETENCIA", "MENOR", "EDAD", "INCIDENTE",
             "HERRAMIENTAS", "RÁPIDO"]
replace = { "re:^chap" = "CHATGPT", "re:^-gpt$" = "", "re:^ia360$" = "AI360", "etiquetera" = "ticketera", "astronoanalistas" = "nuestros analistas", "astronautas" = "nuestros", "resolucionamos" = "solucionamos" }

