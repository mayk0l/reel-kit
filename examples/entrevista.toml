# Reel entrevista completa: InnovaNet & AI360 (CEO) — entrevista Maykol, Tech AI Summit
# Cortes verificados con `reelkit energy` + `reelkit verify` (inicio/final sin contexto).

[project]
raw_dir = "../evento/raw/techaisummit"
work_dir = "../evento/analysis"
out_dir = "render"

[music]
file = "../evento/music/ccby_hasenchat_we_love_tech_house.mp3"
drop_at = 112.45          # el drop cae en "03 EL DESAFÍO"; el tema tiene groove continuo hasta ~195 s
level_lufs = -21
credit = "Música: Hasenchat – We Love Tech House (CC BY 3.0)"

[text]
title = "ENTREVISTA AL CEO DE|{INNOVANET & AI360}"
