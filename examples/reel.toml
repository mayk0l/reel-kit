# Reel "Tech AI Summit" — Maykol & Matías
# Tiempos en segundos del clip original. Cada entrada/salida verificada con `reelkit energy` + `reelkit verify`.
# Marcado de texto: {palabra} = caja de acento, | = salto de línea.

[project]
raw_dir = "raw/techaisummit"
work_dir = "analysis"
out_dir = "render"

[music]
file = "music/ccby_hasenchat_we_love_tech_house.mp3"
drop_at = 337.48          # entrada del bajo; cae en el segmento con drop = true
level_lufs = -21
credit = "Música: Hasenchat – We Love Tech House (CC BY 3.0)"

[text]
title = "¿CÓMO USAN LA {IA}|LAS EMPRESAS|EN CHILE?"
title_sub = "Fuimos al Tech AI Summit a preguntar"
cta = "¿Y TÚ, YA USAS {IA}|EN TU TRABAJO?"
cta_sub = "Te leemos en los comentarios"

[captions]
highlight = ["SEMANA", "HORAS", "DÍAS", "MINUTOS", "SHADOW", "IAS", "20%", "60%", "CONTROL", "GOBERNANZA", "VITAL",
             "AFUERA", "MENOR", "EDAD", "INCIDENTE", "CIBERSEGURIDAD", "HUMANA", "ESENCIAL", "EQUIVOCAN",
             "REEMPLACE", "PERSONAS", "JÓVENES", "PROBAR", "CUALQUIERA", "ENAMORARSE", "PROBLEMA", "SOLUCIÓN", "IMPORTANTE"]
replace = { "re:^tech(ai|eye|ia)" = "TECH AI SUMMIT" }

# ---------------------------------------------------------------- HOOK
[[segment]]
id = "hook1"
src = "IMG_4543"
in = 36.62
out = 41.47
tag = ["DIGEVO", "IA para empresas"]
